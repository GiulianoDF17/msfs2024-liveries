<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Content Security Policy: only our own scripts may run. Images may come
       from project files (lfproj:), the cloud marketplace (https:) and local
       test servers. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' lfproj: data: blob: https: http://127.0.0.1:* http://localhost:*; connect-src 'self' lfproj:; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Livery Forge</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Login / sign-up screen (shown before the main app) -->
  <div id="auth" class="auth hidden"></div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">✈</div>
        <div>
          <div class="brand-name">Livery Forge</div>
          <div class="brand-sub">MSFS 2024 livery studio</div>
        </div>
      </div>

      <div class="current-project" id="currentProject"></div>

      <nav class="nav" id="nav">
        <div class="nav-group">Make a livery</div>
        <button data-screen="projects"><span class="step">0</span>Projects</button>
        <button data-screen="aircraft"><span class="step">1</span>Aircraft</button>
        <button data-screen="paint" data-needs-project><span class="step">2</span>Paint</button>
        <button data-screen="details" data-needs-project><span class="step">3</span>Details</button>
        <button data-screen="export" data-needs-project><span class="step">4</span>Export &amp; test</button>
        <button data-screen="publish"><span class="step">5</span>Publish</button>
        <div class="nav-group">Community</div>
        <button data-screen="market"><span class="step">🛒</span>Marketplace</button>
        <button data-screen="hangar"><span class="step">🛩</span>My hangar</button>
        <button data-screen="studio" data-creator><span class="step">⭐</span>Creator studio</button>
        <div class="nav-group">App</div>
        <button data-screen="settings"><span class="step">6</span>Settings</button>
      </nav>

      <div class="account" id="account"></div>
    </aside>

    <main class="main">
      <section class="screen" id="screen-projects"></section>
      <section class="screen" id="screen-aircraft"></section>
      <section class="screen" id="screen-paint"></section>
      <section class="screen" id="screen-details"></section>
      <section class="screen" id="screen-export"></section>
      <section class="screen" id="screen-publish"></section>
      <section class="screen" id="screen-market"></section>
      <section class="screen" id="screen-hangar"></section>
      <section class="screen" id="screen-studio"></section>
      <section class="screen" id="screen-profile"></section>
      <section class="screen" id="screen-settings"></section>
    </main>
  </div>

  <!-- shared UI -->
  <div id="modal" class="modal-backdrop"></div>
  <div id="toasts" class="toasts"></div>
  <div id="progress" class="progress hidden"><div class="progress-label"></div><div class="progress-bar"><div></div></div></div>

  <script src="editor.js"></script>
  <script src="app.js"></script>
</body>
</html>
